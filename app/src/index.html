<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marwan's Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="sky"></canvas>

  <header id="bar">
    <div class="left">
      <span id="weekTitle">WEEK OF —</span>
      <button id="zoneChip" class="chip" title="Time zone in use">—</button>
    </div>
    <nav class="nav">
      <button id="prevWeek" class="btn" title="Previous week">&lt;&lt;</button>
      <button id="today" class="btn wide">TODAY &#9662;</button>
      <div id="weekPicker" class="weekPicker" hidden>
        <div class="pickHead">JUMP TO WEEK</div>
        <div id="pickRows"></div>
      </div>
      <button id="nextWeek" class="btn" title="Next week">&gt;&gt;</button>
      <button id="hide" class="btn" title="Hide to tray (Esc)">—</button>
    </nav>
  </header>

  <div id="diagnostics" hidden></div>

  <main>
    <section id="schedulePane" class="pane focused">
      <div class="paneHead">
        <span class="mark cyan"></span>
        <span class="paneName">SCHEDULE</span>
        <span id="blockCount" class="count"></span>
      </div>
      <div id="dayHeads" class="dayHeads"></div>
      <div id="filterBar" class="filterBar" hidden>
        <span id="filterLabel"></span>
        <button id="filterClear" class="btn tiny">CLEAR</button>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <section id="todoPane" class="pane">
      <div class="paneHead">
        <span class="mark sand"></span>
        <span class="paneName">TO DO</span>
        <span id="openCount" class="count"></span>
      </div>
      <div id="buckets" class="buckets"></div>
      <form id="addForm" class="addRow" autocomplete="off">
        <input id="addInput" type="text" placeholder="+ add — try: math hw fri ~2h #math   (type help)" />
        <button id="formToggle" type="button" class="formToggle" title="fill in fields instead">&#9662;</button>
      </form>

      <!-- Fields compose a line of the same grammar; nothing here is a second
           way into the store. The preview shows the sentence being built. -->
      <div id="addFields" class="addFields" hidden>
        <label class="ff"><span>TITLE</span>
          <input id="ffTitle" type="text" placeholder="what is it" /></label>

        <div class="ffRow">
          <label class="ff"><span>DATE</span>
            <input id="ffDate" type="date" /></label>
          <label class="ff"><span>TIME</span>
            <input id="ffTime" type="time" /></label>
          <label class="ff"><span>UNTIL</span>
            <input id="ffEnd" type="time" /></label>
        </div>

        <div class="ffRow">
          <label class="ff"><span>HOW LONG</span>
            <input id="ffEst" type="text" inputmode="numeric" placeholder="90m / 2h" /></label>
          <label class="ff"><span>TAG</span>
            <input id="ffTag" type="text" placeholder="math" /></label>
          <label class="ff"><span>PLACE</span>
            <input id="ffPlace" type="text" placeholder="Hall 2.106" /></label>
        </div>

        <div class="ffRow">
          <div class="ff"><span>KIND</span>
            <div class="ffSeg" id="ffKind">
              <button type="button" data-kind="task" class="on">task</button>
              <button type="button" data-kind="block">block</button>
            </div>
          </div>
          <div class="ff"><span>REPEATS</span>
            <div class="ffDays" id="ffDays"></div>
          </div>
          <label class="ff ffCheck"><span>!!</span>
            <input id="ffPriority" type="checkbox" /></label>
        </div>

        <div class="ffFoot">
          <code id="ffPreview" class="ffPreview">—</code>
          <button id="ffAdd" type="button" class="btn wide">add</button>
        </div>
      </div>
      <div id="addEcho" class="addEcho" hidden></div>
      <div id="footHint" class="footHint">
        <span id="statsLine">—</span>
      </div>
    </section>
  </main>

  <div id="timerBar" class="timerBar" hidden>
    <span class="mark gold"></span>
    <span id="timerTitle" class="tTitle"></span>
    <span id="timerElapsed" class="tElapsed">0:00:00</span>
    <span id="timerEstimate" class="tEst"></span>
    <button id="timerStop" class="btn stop">STOP</button>
  </div>

  <div id="undoBar" class="toast" role="status" hidden>
    <span id="undoTitle" class="uTitle"></span>
    <button id="undoButton" class="btn undo" title="or Cmd/Ctrl+Z">UNDO</button>
  </div>

  <div id="dragGhost" class="dragGhost" hidden></div>

  <div id="detailOverlay" class="overlay" hidden>
    <div class="sheet">
      <div class="sheetHead">
        <span class="eyebrow">ITEM</span>
        <button id="detailClose" class="btn">CLOSE</button>
      </div>
      <div id="detailBody" class="detailBody"></div>
    </div>
  </div>

  <div id="helpOverlay" class="overlay" hidden>
    <div class="sheet">
      <div class="sheetHead">
        <span class="eyebrow">SYNTAX</span>
        <button id="helpClose" class="btn">CLOSE</button>
      </div>
      <pre id="helpBody"></pre>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
